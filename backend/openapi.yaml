openapi: 3.1.0
info:
  title: Alafia Backend API
  version: 0.2.0
  description: Contrat initial du backend d’authentification, de chat et d’historique.
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: Vérifier que l’API répond
      responses:
        '200':
          description: Service actif
  /api/auth/register:
    post:
      summary: Créer un compte patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, firstName, lastName, email, phone, password]
              properties:
                role: { type: string, const: PATIENT }
                firstName: { type: string, maxLength: 80 }
                lastName: { type: string, maxLength: 80 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 24 }
                password: { type: string, minLength: 12, maxLength: 72 }
      responses:
        '201':
          description: Compte créé et session ouverte
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string, format: uuid }
                  role: { type: string, const: PATIENT }
        '400': { description: Données invalides }
        '409': { description: E-mail ou téléphone déjà utilisé }
  /api/auth/login:
    post:
      summary: Ouvrir une session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Session ouverte }
        '401': { description: Identifiants incorrects }
  /api/auth/me:
    get:
      summary: Obtenir le compte connecté
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Compte courant }
        '401': { description: Connexion requise }
  /api/auth/logout:
    post:
      summary: Fermer la session
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Session supprimée }
  /api/chat:
    post:
      summary: Obtenir une réponse de l’assistant
      description: Le chat est sans stockage par défaut. Enregistrer une conversation exige une session et saveConversation=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string, minLength: 1, maxLength: 2000 }
                preferredLanguage: { type: string, default: fr }
                saveConversation: { type: boolean, default: false }
                conversationId: { type: string, format: uuid }
      responses:
        '200':
          description: Réponse générée
          content:
            application/json:
              schema:
                type: object
                required: [reply]
                properties:
                  reply: { type: string }
                  conversationId: { type: string, format: uuid }
        '400': { description: Messages invalides }
        '401': { description: Connexion requise pour sauvegarder }
  /api/conversations:
    get:
      summary: Lister les conversations du compte
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Liste du propriétaire connecté }
        '401': { description: Connexion requise }
    post:
      summary: Créer une conversation vide
      security: [{ sessionCookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 120 }
      responses:
        '201': { description: Conversation créée }
        '401': { description: Connexion requise }
  /api/conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Récupérer une conversation appartenant au compte
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Conversation et messages }
        '404': { description: Conversation introuvable }
    delete:
      summary: Supprimer une conversation appartenant au compte
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Conversation supprimée }
        '404': { description: Conversation introuvable }
  /api/patients/me/measurements:
    get:
      summary: Lister les mesures du patient connecté
      security: [{ sessionCookie: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Mesures appartenant au compte courant }
        '401': { description: Connexion requise }
    post:
      summary: Enregistrer une mesure
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value, unit, measuredAt]
              properties:
                type: { type: string, maxLength: 50 }
                value: { type: number, minimum: 0 }
                unit: { type: string, maxLength: 24 }
                measuredAt: { type: string, format: date-time }
                note: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201': { description: Mesure enregistrée }
        '400': { description: Mesure invalide }
        '401': { description: Connexion requise }
  /api/patients/me/measurements/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Modifier une mesure appartenant au compte
      security: [{ sessionCookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, maxLength: 50 }
                value: { type: number, minimum: 0 }
                unit: { type: string, maxLength: 24 }
                measuredAt: { type: string, format: date-time }
                note: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200': { description: Mesure mise à jour }
        '404': { description: Mesure introuvable }
    delete:
      summary: Supprimer une mesure appartenant au compte
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Mesure supprimée }
        '404': { description: Mesure introuvable }
  /api/patients/me/medications:
    get:
      summary: Lister les médicaments saisis par le patient
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Liste appartenant au compte courant }
        '401': { description: Connexion requise }
    post:
      summary: Ajouter un médicament déclaré par le patient
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                reminderTimes:
                  type: array
                  maxItems: 12
                  items: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
                note: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201': { description: Médicament enregistré }
        '400': { description: Champs invalides }
        '401': { description: Connexion requise }
  /api/patients/me/medications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Modifier un médicament appartenant au compte
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Médicament modifié }
        '404': { description: Médicament introuvable }
    delete:
      summary: Supprimer un médicament appartenant au compte
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Médicament supprimé }
        '404': { description: Médicament introuvable }
  /api/patients/me/pregnancy:
    get:
      summary: Lire le suivi grossesse déclaré
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Données du suivi ou null }
        '401': { description: Connexion requise }
    put:
      summary: Enregistrer ou remplacer le suivi déclaré
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discoveryDate]
              properties:
                discoveryDate: { type: string, format: date }
                lastConsultationDate: { type: [string, 'null'], format: date }
                followUpNotes: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200': { description: Suivi enregistré }
        '400': { description: Champs invalides }
        '401': { description: Connexion requise }
    delete:
      summary: Supprimer le suivi du compte connecté
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Suivi supprimé }
  /api/patients/me/appointments:
    get:
      summary: Lister les rendez-vous du compte connecté
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Rendez-vous du propriétaire connecté }
        '401': { description: Connexion requise }
    post:
      summary: Créer un rendez-vous déclaré par le patient
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startsAt, timezone, reason]
              properties:
                startsAt: { type: string, format: date-time }
                timezone: { type: string, example: Africa/Dakar }
                location: { type: [string, 'null'], maxLength: 180 }
                reason: { type: string, maxLength: 300 }
                reminderChannels:
                  type: array
                  items: { type: string, enum: [platform, sms, whatsapp] }
      responses:
        '201': { description: Rendez-vous créé }
        '400': { description: Champs invalides }
        '401': { description: Connexion requise }
  /api/patients/me/appointments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Modifier un rendez-vous appartenant au compte
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Rendez-vous modifié }
        '404': { description: Rendez-vous introuvable }
    delete:
      summary: Supprimer un rendez-vous appartenant au compte
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Rendez-vous supprimé }
        '404': { description: Rendez-vous introuvable }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: alafia.sid
